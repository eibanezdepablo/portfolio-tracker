name: Actualizar datos y publicar

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 20 * * 1-5"   # tras el cierre europeo
    - cron: "15 22 * * 1-5"   # tras el cierre de EE. UU. (mapa de calor)
    - cron: "0 7 * * 2-6"     # valores liquidativos que se publican al día siguiente
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: datos
  cancel-in-progress: false

jobs:
  datos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Descargar precios
        run: python pipeline/actualizar.py
      - name: Guardar datos en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --staged --quiet || git commit -m "Datos $(date -u +%F)"
          git pull --rebase
          git push
      # Mapa de calor y análisis de acciones: rama `mercado` sin historial. Si falla, la cartera sigue.
      - name: Recuperar datos de mercado
        run: |
          mkdir -p data/mercado
          if git ls-remote --exit-code --heads origin mercado >/dev/null; then
            git fetch --depth 1 origin mercado
            git archive FETCH_HEAD | tar -x -C data/mercado
          fi
      - name: Descargar datos de mercado
        continue-on-error: true
        timeout-minutes: 40
        run: python pipeline/mercados.py
      - name: Guardar datos de mercado
        continue-on-error: true
        run: |
          cd data/mercado
          git init -q -b mercado
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898699+github-actions[bot]@users.noreply.github.com" commit -q -m "Mercado $(date -u +%F)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" mercado

  publicar:
    needs: datos
    if: always() && (needs.datos.result == 'success' || needs.datos.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: mercado
          path: data/mercado
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
